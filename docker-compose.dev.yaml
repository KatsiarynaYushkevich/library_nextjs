version: "3.9"

services:
  dev-mongodb:
    image: mongo:4.4
    container_name: dev-mongodb
    command: ["mongod", "--bind_ip_all"]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: kate
      MONGO_INITDB_ROOT_PASSWORD: sword1280
      MONGO_INITDB_DATABASE: library
    volumes:
      - dev-mongo_data:/data/db
      - ./mongo-init.sh:/docker-entrypoint-initdb.d/mongo-init.sh:ro

  dev-mongo-express:
    image: mongo-express:latest
    container_name: dev-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: kate_admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin_password
      ME_CONFIG_MONGODB_SERVER: dev-mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - dev-mongodb

volumes:
  dev-mongo_data:
